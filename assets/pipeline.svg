<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="535" viewBox="0 0 1000 535" font-family="Malgun Gothic,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5F5E5A" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="500" y="25" font-size="22" text-anchor="middle" fill="#333">fold k마다 기저 모델 → IS-P → Si 재판별을 완료</text><rect x="15" y="48" width="296" height="100" rx="9" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="163.0" y="70.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="23" font-weight="700">타일 분할 · 2배 입력</text><text x="163.0" y="98.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="20" font-weight="400">원본 384² · 간격 192</text><text x="163.0" y="126.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="20" font-weight="400">→ 768²</text><rect x="352" y="48" width="296" height="100" rx="9" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="500.0" y="70.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="23" font-weight="700">기저 모델 · D4</text><text x="500.0" y="98.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="20" font-weight="400">8방향 softmax 예측</text><text x="500.0" y="126.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="20" font-weight="400">역변환 후 확률 평균</text><rect x="689" y="48" width="296" height="100" rx="9" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="837.0" y="70.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="23" font-weight="700">원본 확률맵 조립</text><text x="837.0" y="98.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="20" font-weight="400">2×2 평균으로 복원</text><text x="837.0" y="126.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="20" font-weight="400">Gaussian 겹침 가중 평균</text><polyline points="311,98 352,98" fill="none" stroke="#5F5E5A" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="648,98 689,98" fill="none" stroke="#5F5E5A" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="837,148 837,171 163,171 163,196" fill="none" stroke="#5F5E5A" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="15" y="199" width="296" height="110" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="163.0" y="226.0" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="23" font-weight="700">IS-P 공간 보정</text><text x="163.0" y="254.0" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="20" font-weight="400">4상 확률 → 작은 CNN</text><text x="163.0" y="282.0" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="20" font-weight="400">softmax(log p + Δ)</text><rect x="352" y="199" width="296" height="110" rx="9" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/><text x="500.0" y="226.0" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-size="23" font-weight="700">Si 성분 · 특징</text><text x="500.0" y="254.0" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-size="20" font-weight="400">PSi∪ESi의 8연결 성분</text><text x="500.0" y="282.0" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-size="20" font-weight="400">B2 6개 + DINO PCA16</text><rect x="689" y="199" width="296" height="110" rx="9" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/><text x="837.0" y="226.0" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-size="23" font-weight="700">상 확률 재분배</text><text x="837.0" y="254.0" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-size="20" font-weight="400">HGB → q = P(PSi)</text><text x="837.0" y="282.0" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-size="20" font-weight="400">PSi : ESi = q : (1−q)</text><polyline points="311,253 352,253" fill="none" stroke="#5F5E5A" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="648,253 689,253" fill="none" stroke="#5F5E5A" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="837,309 837,347 500,347 500,376" fill="none" stroke="#5F5E5A" stroke-width="1.7" marker-end="url(#arrow)"/><text x="500" y="337" font-size="20" text-anchor="middle" fill="#333">Si 확률 합과 Al₃Ni·Al 확률을 유지</text><rect x="167" y="380" width="666" height="70" rx="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="500.0" y="401.0" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="23" font-weight="700">보정된 5개 fold 확률 균등 평균 → argmax</text><text x="500.0" y="429.0" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="20" font-weight="400">원본 크기 · 지정 4색 RGB · 무손실 PNG</text><text x="500" y="493" font-size="20" text-anchor="middle" fill="#333">각 후처리는 단일 fold 모델의 확률을 입력으로 받음</text></svg>